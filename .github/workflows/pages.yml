name: Deploy Saeid Brain to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Apply production 3D upgrades
        run: node scripts/deploy-transform.js
      - name: Bundle Porsche 911 model into Pages artifact
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/playcanvas/web-components/main/examples/assets/models/porsche-911-carrera-4s.glb" \
            --output assets/porsche-911-carrera-4s.glb
          test -s assets/porsche-911-carrera-4s.glb
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
